<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="CineFolio: build your cinematic AI portfolio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12244B"/>
      <stop offset="0.55" stop-color="#0E1C3F"/>
      <stop offset="1" stop-color="#0A1631"/>
    </linearGradient>
    <linearGradient id="flare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8102E" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#C8102E" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#E6394A" stop-opacity="0.75"/>
      <stop offset="0.78" stop-color="#C8102E" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C8102E" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- anamorphic crimson streak -->
  <g filter="url(#soft)" opacity="0.9">
    <rect x="60" y="150" width="1080" height="26" fill="url(#flare)"/>
  </g>
  <rect x="60" y="161" width="1080" height="2" fill="#E6394A" opacity="0.5"/>

  <!-- wordmark -->
  <text x="600" y="360" text-anchor="middle"
        font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace"
        font-size="132" font-weight="600" letter-spacing="14" fill="#F4EFE6">CINEFOLIO</text>

  <!-- gold hairline rule -->
  <rect x="325" y="405" width="550" height="2" fill="#D9A441"/>

  <!-- tagline -->
  <text x="600" y="452" text-anchor="middle"
        font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace"
        font-size="27" font-weight="400" letter-spacing="10" fill="#D9A441">BUILD YOUR CINEMATIC AI PORTFOLIO</text>

  <!-- film-lens glyph, bottom-left -->
  <g transform="translate(70,540)">
    <circle cx="24" cy="24" r="20" fill="none" stroke="#D9A441" stroke-width="4"/>
    <circle cx="24" cy="24" r="6" fill="#C8102E"/>
  </g>
</svg>
