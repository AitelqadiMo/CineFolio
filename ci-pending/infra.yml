# ============================================================================
# FALLBACK COPY. This file could not be committed to its real home at
# .github/workflows/infra.yml because the connected GitHub integration token
# lacks the 'workflow' OAuth scope: pushing any file under .github/workflows/
# is rejected by the GitHub API with:
#   403 "Resource not accessible by integration" (failed to create tree)
#
# This is the successor to the former infra/ci/deploy.yml (which had the same
# limitation, per its own header). infra/ci/deploy.yml has been left in place
# so the repo does not lose its infra workflow until this one is installed.
#
# TO INSTALL (one manual step, by a human with workflow scope):
#   git mv ci-pending/infra.yml .github/workflows/infra.yml
#   git rm infra/ci/deploy.yml   # now superseded and live in the real location
#   git commit -m "ci: install infra workflow" && git push
# Then delete this ci-pending/ directory.
# ============================================================================

# CineFolio infrastructure CI. Terraform plan on every PR that touches infra/**,
# apply on pushes to main. CI assumes the deploy role via GitHub OIDC, so no
# long-lived AWS credentials live in the pipeline.
name: infra
on:
  push:
    branches: [main]
    paths: ["infra/**"]
  pull_request:
    paths: ["infra/**"]

permissions:
  id-token: write   # required for OIDC
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: "eu-central-1"
  WORKDIR: "infra/envs/dev"

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::975050163168:role/cinefolio-dev-gha-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: fmt
        run: terraform -chdir=${{ env.WORKDIR }} fmt -check -recursive
      - name: init
        run: terraform -chdir=${{ env.WORKDIR }} init -backend-config="bucket=cinefolio-dev-tfstate-975050163168"
      - name: validate
        run: terraform -chdir=${{ env.WORKDIR }} validate
      - name: plan
        run: terraform -chdir=${{ env.WORKDIR }} plan -no-color
      # apply on main only, after review
      - name: apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform -chdir=${{ env.WORKDIR }} apply -auto-approve
