# CineFolio API test suite: the guard rail for every push and PR into main.
# The route-level suite runs against in-memory fakes, so it needs no AWS, no
# network, and no external services. Fast by design: no dependency install,
# no caching. This is what protects main during the revenue sprint.
name: test
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node:test route suite
        run: node --test
        working-directory: infra/modules/api/lambda
